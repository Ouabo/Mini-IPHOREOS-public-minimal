<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="390" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">From a Python file to the onboard computer</text><rect x="30" y="85" width="325" height="180" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">1 / Open one file</text><text x="48" y="147" class="small">flash/01_sensor_only.py</text><text x="48" y="172" class="small">Review settings near the top.</text><text x="48" y="197" class="small">Motors are disabled.</text><rect x="390" y="85" width="320" height="180" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="408" y="117" class="label">2 / Python Editor</text><text x="408" y="147" class="small">Open python.microbit.org</text><text x="408" y="172" class="small">Load the complete .py file.</text><text x="408" y="197" class="small">Connect with a data cable.</text><rect x="745" y="85" width="325" height="180" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="763" y="117" class="label">3 / Transfer + run</text><text x="763" y="147" class="small">Send to micro:bit, or</text><text x="763" y="172" class="small">download the .hex file and</text><text x="763" y="197" class="small">copy it to MICROBIT.</text><text x="35" y="320" class="label">A .py file copied onto the USB drive is not a flashed program.</text><text x="35" y="355" class="note">Use MicroPython in the official Python Editor; do not paste this project into MakeCode Python.</text></svg>