<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="370" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">Buy one robot kit, one brain and four AA cells</text><rect x="30" y="80" width="325" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="112" class="label">:MOVE Motor 5683</text><text x="48" y="142" class="small">Chassis + two wheels</text><text x="48" y="167" class="small">Motors + motor electronics</text><text x="48" y="192" class="small">Ultrasonic sensor</text><text x="48" y="217" class="small">Built-in AA holders</text><rect x="390" y="80" width="320" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="408" y="112" class="label">micro:bit V2 Go</text><text x="408" y="142" class="small">Onboard computer</text><text x="408" y="167" class="small">USB data cable included</text><text x="408" y="192" class="small">Bundle AAA cells are</text><text x="408" y="217" class="small">not the robot AA supply</text><rect x="745" y="80" width="325" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="763" y="112" class="label">Simple test equipment</text><text x="763" y="142" class="small">4 matched AA cells</text><text x="763" y="167" class="small">Ruler / tape measure</text><text x="763" y="192" class="small">Wide cardboard target</text><text x="763" y="217" class="small">Floor tape; your laptop</text><text x="35" y="330" class="note">No separate motor driver, breadboard, camera, soldering iron or 3D printer is needed for this build.</text></svg>