<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="370" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">One-dimensional belief: the same equations run on both computers</text><rect x="30" y="85" width="325" height="190" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">PREDICT</text><text x="48" y="147" class="small">mu_minus = mu - speed*dt</text><text x="48" y="172" class="small">                 - expected_coast</text><text x="48" y="197" class="small">P_minus = P + Q</text><text x="48" y="222" class="small">Use executed pulse duration.</text><rect x="390" y="85" width="320" height="190" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="408" y="117" class="label">CORRECT</text><text x="408" y="147" class="small">K = P_minus / (P_minus + R)</text><text x="408" y="172" class="small">mu = mu_minus</text><text x="408" y="197" class="small">        + K*(reading - mu_minus)</text><text x="408" y="222" class="small">P = max(floor, (1-K)*P_minus)</text><rect x="745" y="85" width="325" height="190" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="763" y="117" class="label">INTERPRET</text><text x="763" y="147" class="small">mu: distance estimate (cm)</text><text x="763" y="172" class="small">sqrt(P): model uncertainty</text><text x="763" y="197" class="small">R: sensor noise variance</text><text x="763" y="222" class="small">Q: movement uncertainty</text><text x="35" y="330" class="note">The variance floor is a conservative engineering heuristic. Repeated biased readings do not reveal the bias.</text></svg>