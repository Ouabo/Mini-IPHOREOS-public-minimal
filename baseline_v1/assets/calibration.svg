<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="380" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">Calibration makes symbols correspond to your robot</text><rect x="30" y="85" width="325" height="195" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">SENSOR</text><text x="48" y="147" class="small">20 readings at each distance:</text><text x="48" y="172" class="small">20, 30, 40 and 60 cm.</text><text x="48" y="197" class="small">bias = mean(raw - true)</text><text x="48" y="222" class="small">R = variance of residuals</text><rect x="390" y="85" width="320" height="195" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="408" y="117" class="label">MOTION</text><text x="408" y="147" class="small">Repeat the same short pulse.</text><text x="408" y="172" class="small">Measure powered travel</text><text x="408" y="197" class="small">and coast after power-off.</text><text x="408" y="222" class="small">Use at least five trials.</text><rect x="745" y="85" width="325" height="195" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="763" y="117" class="label">CHECK</text><text x="763" y="147" class="small">Use fresh test distances.</text><text x="763" y="172" class="small">Look for scale error or drift.</text><text x="763" y="197" class="small">Verify stopping time.</text><text x="763" y="222" class="small">Save floor and battery notes.</text><text x="35" y="335" class="note">If powered travel and coast cannot be separated, use a conservative total-pulse model and validate it.</text></svg>