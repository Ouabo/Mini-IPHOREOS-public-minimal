<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="380" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">Same belief, different context: a deliberate pause</text><rect x="30" y="85" width="325" height="195" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">SAME ESTIMATE</text><text x="48" y="147" class="small">Distance mean = 26 cm</text><text x="48" y="172" class="small">Standard deviation = 2 cm</text><text x="48" y="197" class="small">Predicted step = 1.11 cm</text><text x="48" y="222" class="small">Extra margin = 0.5 cm</text><rect x="390" y="85" width="320" height="195" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="408" y="117" class="label">NORMAL: k = 1.64</text><text x="408" y="147" class="small">26 - 1.64*2 - 1.11 - 0.5</text><text x="408" y="172" class="small">= 21.11 cm</text><text x="408" y="197" class="small">Above the lower band edge:</text><text x="408" y="222" class="small">one short MOVE is allowed.</text><rect x="745" y="85" width="325" height="195" rx="14" fill="#fff3df" stroke="#bfd3d7"/><text x="763" y="117" class="label">CAREFUL: k = 2.33</text><text x="763" y="147" class="small">26 - 2.33*2 - 1.11 - 0.5</text><text x="763" y="172" class="small">= 19.73 cm</text><text x="763" y="197" class="small">Below the lower band edge:</text><text x="763" y="222" class="small">remain stopped and SAMPLE.</text><text x="35" y="335" class="note">Illustrative initial conditions matching the unit test. Neither mode guarantees safety under an incorrect model.</text></svg>