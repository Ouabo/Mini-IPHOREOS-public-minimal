<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="380" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">Build capability one verified step at a time</text><rect x="30" y="85" width="235" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">SESSION 1</text><text x="48" y="147" class="small">Buy / assemble</text><text x="48" y="172" class="small">Flash sensor program</text><text x="48" y="197" class="small">Read distances</text><text x="48" y="222" class="small">No motor motion</text><rect x="300" y="85" width="235" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="318" y="117" class="label">SESSION 2</text><text x="318" y="147" class="small">Supported wheels</text><text x="318" y="172" class="small">One short pulse</text><text x="318" y="197" class="small">Calibrate sensing</text><text x="318" y="222" class="small">Calibrate motion</text><rect x="570" y="85" width="235" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="588" y="117" class="label">SESSION 3</text><text x="588" y="147" class="small">Raw baseline</text><text x="588" y="172" class="small">Belief controller</text><text x="588" y="197" class="small">Mini normal/careful</text><text x="588" y="222" class="small">Measure real outcomes</text><rect x="840" y="85" width="230" height="200" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="858" y="117" class="label">SESSION 4</text><text x="858" y="147" class="small">Repeat trials</text><text x="858" y="172" class="small">Compare failures</text><text x="858" y="197" class="small">Plot measurements</text><text x="858" y="222" class="small">Write your conclusion</text><text x="35" y="340" class="note">Planning estimate: 12–20 learning hours after delivery, depending on programming and calibration experience.</text></svg>