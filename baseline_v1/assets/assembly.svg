<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="390" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">Assembly: power off; use the supplied orientation guide</text><rect x="30" y="85" width="325" height="170" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">1 / Fit the wheels</text><text x="48" y="147" class="small">Press each wheel onto</text><text x="48" y="172" class="small">its motor shaft as shown</text><text x="48" y="197" class="small">in the kit booklet.</text><rect x="390" y="85" width="320" height="170" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="408" y="117" class="label">2 / Insert micro:bit</text><text x="408" y="147" class="small">Align the edge connector</text><text x="408" y="172" class="small">using the manufacturer</text><text x="408" y="197" class="small">picture; never force it.</text><rect x="745" y="85" width="325" height="170" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="763" y="117" class="label">3 / Fit four AA cells</text><text x="763" y="147" class="small">Match + and - markings.</text><text x="763" y="172" class="small">Do not connect the separate</text><text x="763" y="197" class="small">AAA pack at the same time.</text><text x="35" y="315" class="label">First power-on: sensor-only firmware; robot stationary; physical switch accessible.</text><text x="35" y="350" class="note">This schematic explains the order, not exact connector orientation or component placement.</text></svg>