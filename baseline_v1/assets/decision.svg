<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0D8080"/></marker></defs><rect width="1100" height="410" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#0F1E2E}.title{font-size:27px;font-weight:bold}.label{font-size:21px;font-weight:bold}.small{font-size:18px}.note{font-size:16px;fill:#526c7c}</style><text x="30" y="40" class="title">The robot moves only in short, explicit events</text><rect x="30" y="85" width="235" height="130" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="48" y="117" class="label">OBSERVE</text><text x="48" y="147" class="small">Motors are stopped.</text><text x="48" y="172" class="small">Read fresh distance.</text><path d="M270,150 L295,150" stroke="#0D8080" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="85" width="235" height="130" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="318" y="117" class="label">UPDATE</text><text x="318" y="147" class="small">Check validity.</text><text x="318" y="172" class="small">Update distance belief.</text><path d="M540,150 L565,150" stroke="#0D8080" stroke-width="3" marker-end="url(#arrow)"/><rect x="570" y="85" width="235" height="130" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="588" y="117" class="label">DECIDE</text><text x="588" y="147" class="small">MOVE / SAMPLE</text><text x="588" y="172" class="small">DONE / ABORT</text><path d="M810,150 L835,150" stroke="#0D8080" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="85" width="230" height="130" rx="14" fill="#EEF5F5" stroke="#bfd3d7"/><text x="858" y="117" class="label">EXECUTE</text><text x="858" y="147" class="small">Pulse, then stop.</text><text x="858" y="172" class="small">Wait for settling.</text><rect x="300" y="260" width="505" height="95" rx="14" fill="#fff3df" stroke="#bfd3d7"/><text x="318" y="292" class="label">If uncertainty remains</text><text x="318" y="322" class="small">Stay stopped; remeasure; terminate after bounded retries.</text><path d="M955,220 L955,380 L145,380 L145,220" fill="none" stroke="#0D8080" stroke-width="3" marker-end="url(#arrow)"/></svg>